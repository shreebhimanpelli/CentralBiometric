version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: flame_biometric_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: flame_biometric
      MYSQL_USER: flame_user
      MYSQL_PASSWORD: flame_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
    driver: local
